[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autohe-prs"
version = "0.1.0"
description = "Constraint-safe OpenFHE autotuning for encrypted polygenic risk scores"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "PyYAML>=6", "psutil>=5.9"]
ml = ["numpy>=1.26", "scikit-learn>=1.3", "joblib>=1.3"]
boosted = ["numpy>=1.26", "scikit-learn>=1.3", "xgboost>=2", "lightgbm>=4"]
report = ["matplotlib>=3.8"]
he = ["numpy>=1.26", "tenseal==0.3.16"]
test = ["pytest>=7"]

[project.scripts]
autohe-prs = "autohe_prs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
