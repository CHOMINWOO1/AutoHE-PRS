workload:
  operation: prs_weighted_sum
  genotype_path: data/harmonized/dosage.csv
  weight_path: data/harmonized/weights.csv
  genotype_encoding: hard_call
  variants: null
  samples: null
  scores: 1
  missing_policy: error
  genome_build: GRCh37

constraints:
  security_bits: 128
  max_absolute_error: 1.0e-6
  max_relative_error: 1.0e-5
  max_memory_mb: 32768
  max_latency_seconds: null
  require_decryption_success: true

optimization:
  objective: evaluation_latency
  allowed_schemes:
    - CKKS
    - BFV
    - BGV
  top_k_validation: 10
  use_bayesian_refinement: true

hardware:
  profile: local_cpu
